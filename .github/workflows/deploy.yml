name: Deploy da API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-da-api
  cancel-in-progress: false

jobs:
  testar:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore LumiMakeup.slnx

      - name: Rodar os testes
        run: >-
          dotnet test LumiMakeup.slnx
          -c Release
          --no-restore
          --logger "trx;LogFileName=testes.trx"
          --results-directory Resultados

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-dos-testes
          path: Resultados/*.trx
          if-no-files-found: ignore
          retention-days: 7

  publicar:
    name: Publicar
    needs: testar
    runs-on: windows-latest
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar
        run: dotnet publish src/LumiMakeup.Api/LumiMakeup.Api.csproj -c Release -o publicacao

      - name: Remover a pasta runtimes
        shell: pwsh
        run: |
          # A pasta runtimes/ traz os assemblies especificos por RID (win/lib/net7.0 e
          # win/lib/net8.0). Numa publicacao sem -r, quem roda e a copia portatil da raiz,
          # entao ela e dispensavel - e sao 621 KB e quatro niveis de diretorio a menos.
          if (Test-Path 'publicacao\runtimes') {
            $tamanho = [math]::Round((Get-ChildItem 'publicacao\runtimes' -Recurse -File | Measure-Object Length -Sum).Sum / 1KB)
            Remove-Item 'publicacao\runtimes' -Recurse -Force
            Write-Output "runtimes/ removido ($tamanho KB)"
          }

      - name: Conferir o artefato
        shell: pwsh
        run: |
          foreach ($arquivo in @('LumiMakeup.Api.dll', 'LumiMakeup.Api.runtimeconfig.json', 'web.config')) {
            if (-not (Test-Path "publicacao\$arquivo")) { throw "Faltou $arquivo na publicacao." }
          }
          if (Test-Path 'publicacao\appsettings.Production.json') {
            throw 'appsettings.Production.json entrou no artefato. Os segredos ficam so no servidor.'
          }

          # O artefato tem que ser PLANO. A action de FTP abre uma conexao de dados nova
          # por diretorio criado, e o servidor do IIS derruba a partir da terceira com
          # ECONNRESET - foi assim que este deploy falhou duas vezes. Os outros projetos
          # que publicam por aqui sao planos, por isso nunca falharam.
          $subdiretorios = @(Get-ChildItem publicacao -Directory -Recurse)
          if ($subdiretorios.Count -gt 0) {
            $nomes = ($subdiretorios | ForEach-Object { $_.FullName.Replace('publicacao\', '') }) -join ', '
            throw "O artefato tem $($subdiretorios.Count) subdiretorio(s): $nomes. Publique plano ou o FTP vai cair com ECONNRESET."
          }

          Write-Output "ok: $((Get-ChildItem publicacao -File).Count) arquivos, nenhum subdiretorio"

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publicacao
          if-no-files-found: error
          retention-days: 7

  enviar:
    name: Enviar para o servidor
    needs: publicar
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Baixar o artefato
        uses: actions/download-artifact@v4
        with:
          name: api
          path: artefato

      - name: Conferir que o artefato nao trouxe segredo
        run: |
          if [ -e artefato/appsettings.Production.json ]; then
            echo "::error::O artefato contem appsettings.Production.json. Chave no artifact fica exposta para quem le o repositorio."
            exit 1
          fi

      - name: Montar o appsettings de producao
        env:
          BANCO_SERVIDOR: ${{ secrets.BANCO_SERVIDOR }}
          BANCO_PORTA: ${{ secrets.BANCO_PORTA }}
          BANCO_NOME: ${{ secrets.BANCO_NOME }}
          BANCO_USUARIO: ${{ secrets.BANCO_USUARIO }}
          BANCO_SENHA: ${{ secrets.BANCO_SENHA }}
          BANCO_CHARSET: ${{ secrets.BANCO_CHARSET }}
          BANCO_SSL: ${{ secrets.BANCO_SSL }}
          BANCO_ALLOW_PUBLIC_KEY: ${{ secrets.BANCO_ALLOW_PUBLIC_KEY }}
          JWT_SEGREDO: ${{ secrets.JWT_SEGREDO }}
          RECAPTCHA_CHAVE_SECRETA: ${{ secrets.RECAPTCHA_CHAVE_SECRETA }}
          IA_CHAVE: ${{ secrets.IA_CHAVE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          GOOGLE_SEGREDO_CLIENTE: ${{ secrets.GOOGLE_SEGREDO_CLIENTE }}
          BREVO_CHAVE_API: ${{ secrets.BREVO_CHAVE_API }}
          BAILEYS_SEGREDO_COMPARTILHADO: ${{ secrets.BAILEYS_SEGREDO_COMPARTILHADO }}
          BAILEYS_HABILITADO: ${{ secrets.BAILEYS_HABILITADO }}
          BAILEYS_INICIAR_PROCESSO: ${{ secrets.BAILEYS_INICIAR_PROCESSO }}
          BAILEYS_PASTA_DO_NODE: ${{ secrets.BAILEYS_PASTA_DO_NODE }}
          BAILEYS_EXECUTAVEL: ${{ secrets.BAILEYS_EXECUTAVEL }}
          BAILEYS_PORTA: ${{ secrets.BAILEYS_PORTA }}
          BAILEYS_URL_BASE: ${{ secrets.BAILEYS_URL_BASE }}
          FOCUSNFE_ID_CLIENTE: ${{ secrets.FOCUSNFE_ID_CLIENTE }}
          FOCUSNFE_SEGREDO_CLIENTE: ${{ secrets.FOCUSNFE_SEGREDO_CLIENTE }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          def texto(nome):
              return (os.environ.get(nome) or "").strip()

          def segredo(nome):
              return os.environ.get(nome) or ""

          def obrigatorio(nome):
              valor = texto(nome)
              if not valor:
                  sys.exit("::error::O secret " + nome + " nao esta cadastrado, e a API nao sobe sem ele.")
              return valor

          def segredo_obrigatorio(nome):
              valor = segredo(nome)
              if not valor.strip():
                  sys.exit("::error::O secret " + nome + " nao esta cadastrado, e a API nao sobe sem ele.")
              return valor

          def numero(nome, padrao):
              bruto = texto(nome)
              if not bruto:
                  return padrao
              try:
                  return int(bruto)
              except ValueError:
                  sys.exit("::error::O secret " + nome + " precisa ser um numero inteiro.")

          def opcao(nome, padrao, aceitos):
              valor = texto(nome) or padrao
              if valor.lower() not in aceitos:
                  sys.exit(
                      "::error::O secret " + nome + " recebeu '" + valor
                      + "'. Valores aceitos: " + ", ".join(sorted(aceitos)) + "."
                  )
              return valor

          def aspas(valor):
              if valor == "":
                  return ""
              precisa = any(c.isspace() or c in ';"' for c in valor)
              if not precisa:
                  return valor
              return '"' + valor.replace('"', '""') + '"'

          def montar_conexao():
              partes = [
                  "Server=" + aspas(obrigatorio("BANCO_SERVIDOR")),
                  "Port=" + str(numero("BANCO_PORTA", 3306)),
                  "Database=" + aspas(obrigatorio("BANCO_NOME")),
                  "Uid=" + aspas(obrigatorio("BANCO_USUARIO")),
                  "Pwd=" + aspas(segredo_obrigatorio("BANCO_SENHA")),
                  "CharSet=" + aspas(texto("BANCO_CHARSET") or "utf8mb4"),
                  "SslMode=" + opcao("BANCO_SSL", "Preferred", {
                      "none", "disabled", "preferred", "required", "verifyca", "verifyfull"
                  }),
                  "AllowPublicKeyRetrieval=" + opcao("BANCO_ALLOW_PUBLIC_KEY", "true", {
                      "true", "false"
                  })
              ]
              return ";".join(partes) + ";"

          configuracao = {
              "ConnectionStrings": {
                  "ConexaoPadrao": montar_conexao()
              },
              "Jwt": {
                  "Segredo": segredo_obrigatorio("JWT_SEGREDO")
              },
              "ExternalServices": {
                  "Recaptcha": {
                      "ChaveSecreta": segredo("RECAPTCHA_CHAVE_SECRETA")
                  },
                  "Ia": {
                      "Chave": segredo("IA_CHAVE")
                  },
                  "Smtp": {
                      "Host": texto("SMTP_HOST"),
                      "Porta": numero("SMTP_PORTA", 465),
                      "Usuario": texto("SMTP_USUARIO"),
                      "Senha": segredo("SMTP_SENHA")
                  },
                  "Google": {
                      "SegredoCliente": segredo("GOOGLE_SEGREDO_CLIENTE")
                  },
                  "Brevo": {
                      "ChaveApi": segredo("BREVO_CHAVE_API")
                  },
                  "Baileys": {
                      "Habilitado": texto("BAILEYS_HABILITADO") == "true",
                      "IniciarProcesso": texto("BAILEYS_INICIAR_PROCESSO") == "true",
                      "SegredoCompartilhado": segredo("BAILEYS_SEGREDO_COMPARTILHADO"),
                      # Endereco do servico do Node no Render. Vem de secret
                      # porque o Render sorteia o nome do servico na criacao, e
                      # a API precisa do valor exato para falar com ele.
                      "UrlBase": texto("BAILEYS_URL_BASE") or "http://127.0.0.1:" + str(numero("BAILEYS_PORTA", 3001)),
                      "PastaDoNode": texto("BAILEYS_PASTA_DO_NODE"),
                      "Executavel": texto("BAILEYS_EXECUTAVEL") or "node.exe",
                      "Porta": numero("BAILEYS_PORTA", 3001)
                  },
                  "FocusNfe": {
                      "IdCliente": segredo("FOCUSNFE_ID_CLIENTE"),
                      "SegredoCliente": segredo("FOCUSNFE_SEGREDO_CLIENTE")
                  }
              }
          }

          with open("artefato/appsettings.Production.json", "w", encoding="utf-8") as arquivo:
              json.dump(configuracao, arquivo, indent=2, ensure_ascii=False)
              arquivo.write("\n")

          print("ok: appsettings.Production.json gerado.")
          PY

      - name: Conferir os segredos do FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          faltando=""
          [ -n "$FTP_HOST" ] || faltando="$faltando FTP_HOST"
          [ -n "$FTP_USERNAME" ] || faltando="$faltando FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || faltando="$faltando FTP_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error::Secret nao cadastrado neste repositorio:$faltando"
            echo "Settings -> Secrets and variables -> Actions -> aba Repository secrets."
            echo "Nao e a aba Repository variables: la o valor chega vazio."
            exit 1
          fi
          echo "ok: os tres segredos do FTP estao cadastrados"

      - name: Conferir a conexao do FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
        run: |
          # ftps = TLS explicito na porta 21 (AUTH TLS). ftps-legacy = TLS implicito na
          # 990. ftp = sem TLS. Nenhum deles muda o modo passivo: o canal de dados e
          # aberto com EPSV em IPv6 ou PASV em IPv4, nos tres casos.
          #
          # ftps-legacy em 990 so funciona se a porta estiver liberada; fechada, daria
          # connection refused na conexao de controle, e nao um reset no socket de dados.
          #
          # Se o protocolo for ftp, o appsettings.Production.json atravessa em texto
          # legivel, e ele carrega a senha do banco e o segredo do JWT.
          echo "host=$FTP_HOST porta=$FTP_PORT protocolo=$FTP_PROTOCOL"
          if [ "$FTP_PROTOCOL" = "ftp" ]; then
            echo "::warning::FTP sem TLS: a senha do banco e o segredo do JWT vao em texto legivel."
          fi
          if [ "$FTP_PROTOCOL" = "ftps-legacy" ] && [ "$FTP_PORT" = "21" ]; then
            echo "::error::ftps-legacy e TLS implicito e precisa da porta 990, nao da 21. Ajuste FTP_PORT para 990 ou volte o protocolo para ftps."
            exit 1
          fi
          for endereco in $(getent ahosts "$FTP_HOST" | awk '{print $1}' | sort -u); do
            familia="IPv4"
            case "$endereco" in *:*) familia="IPv6";; esac
            echo "  $familia $endereco"
          done
          echo "se aparecer IPv6, e por ele que o canal de dados vai ser aberto (EPSV)."

      - name: Enviar a publicacao
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: artefato/
          server-dir: ${{ secrets.DIRETORIO_DA_API || 'api.lumimakeup.com.br/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/*.pdb
          timeout: 900000
          log-level: standard

      # NAO existe passo de health check aqui, e a ausencia e proposital.
      #
      # A aplicacao precisa estar parada antes do deploy: o IIS segura as DLLs
      # carregadas e recusa a sobrescrita enquanto o Application Pool esta no
      # ar. Quem para e o Clayton, manualmente, pelo painel da hospedagem.
      #
      # Logo, no instante em que o FTP termina, a API esta fora do ar por
      # padrao - ate o pool ser levantado de novo. Um health check nesse
      # intervalo falha sempre, e um deploy que falha por isso e pior do que
      # um deploy que nao verifica nada: faz parecer que algo quebrou quando o
      # unico problema e a aplicacao estar parada.
      #
      # A regra esta escrita no AGENTS.md, na secao Deploy. Para saber se a API
      # subiu, abra https://api.lumimakeup.com.br/api/saude no navegador depois
      # de levantar o pool.
      - name: Aviso sobre o pool
        run: |
          echo "::notice::Arquivos enviados. A API sobe quando o Application Pool for levantado de novo - nao ha health check porque a aplicacao estava parada durante o envio."
